# Muted sage and slate palette for a calmer finance dashboard
[theme]
base = "dark"
primaryColor = "#4E7165"
backgroundColor = "#111715"
secondaryBackgroundColor = "#1A211F"
codeBackgroundColor = "#151C19"
textColor = "#E4E9E5"
linkColor = "#A5BDB2"
borderColor = "#303A35"
codeTextColor = "#C7D0CA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#78A28B"
redColor = "#C27F82"
yellowColor = "#B59C70"
orangeColor = "#B88670"
blueColor = "#8099A8"
violetColor = "#9587A1"
grayColor = "#929D96"
chartCategoricalColors = ["#759487", "#788F9E", "#B19A73", "#AA8586", "#829179", "#92869B", "#6F9290", "#B39380"]
chartSequentialColors = ["#172822", "#21372F", "#2D473C", "#3A5849", "#496957", "#5A7966", "#6D8A76", "#829B87", "#9EAF9F", "#C1CEC3"]
dataframeBorderColor = "#303A35"
dataframeHeaderBackgroundColor = "#222B27"
dataframeHeaderTextColor = "#E4E9E5"

[theme.sidebar]
backgroundColor = "#111715"
secondaryBackgroundColor = "#1A211F"
codeBackgroundColor = "#151C19"
textColor = "#E4E9E5"
borderColor = "#303A35"
primaryColor = "#4E7165"

[server]
address = "0.0.0.0"
port = 8501
headless = true
