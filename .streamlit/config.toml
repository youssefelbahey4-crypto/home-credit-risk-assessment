# Elegant, high-contrast financial dashboard theme
[theme]
base = "dark"
primaryColor = "#4FD1C5"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#151F2D"
codeBackgroundColor = "#101A28"
textColor = "#E6EDF7"
linkColor = "#75D6CC"
borderColor = "#2A394B"
codeTextColor = "#C7D2E0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#4ADE80"
redColor = "#FB7185"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#4FD1C5", "#60A5FA", "#C4B5FD", "#FBBF24", "#FB7185", "#38BDF8", "#A3E635", "#F9A8D4"]
chartSequentialColors = ["#0B3B3A", "#0F5350", "#126B66", "#16837C", "#1D9B91", "#35B3A8", "#5ACABB", "#82D9CD", "#AEE8DF", "#DDF7F1"]
dataframeBorderColor = "#2A394B"
dataframeHeaderBackgroundColor = "#192636"
dataframeHeaderTextColor = "#F3F7FB"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#151F2D"
codeBackgroundColor = "#101A28"
textColor = "#E6EDF7"
borderColor = "#2A394B"
primaryColor = "#4FD1C5"

[server]
address = "0.0.0.0"
port = 8501
headless = true
