# Navy, royal blue, and soft status colors for a clear finance dashboard
[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#172033"
textColor = "#F8FAFC"
linkColor = "#93C5FD"
borderColor = "#334155"
codeTextColor = "#DBEAFE"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#F59E0B"
orangeColor = "#F59E0B"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = ["#2563EB", "#10B981", "#F59E0B", "#EF4444", "#64748B", "#7C3AED", "#06B6D4", "#F97316"]
chartSequentialColors = ["#172554", "#1E3A8A", "#1D4ED8", "#2563EB", "#3B82F6", "#60A5FA", "#93C5FD", "#BFDBFE", "#DBEAFE", "#EFF6FF"]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#172033"
textColor = "#F8FAFC"
borderColor = "#334155"
primaryColor = "#2563EB"

[server]
address = "0.0.0.0"
port = 8501
headless = true
